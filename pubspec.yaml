name: stock_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI & utilities
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  xml: ^6.6.1
  url_launcher: ^6.3.0

  # Article detail & sharing
  webview_flutter: ^4.9.0
  share_plus: ^10.0.0

  # Charts
  fl_chart: ^1.1.0

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  google_sign_in: ^6.2.1   # optional but enabled in LoginPage below
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# ---- Fix for fl_chart requiring newer vector_math APIs ----
dependency_overrides:
  vector_math: ^2.1.5

flutter:
  uses-material-design: true
